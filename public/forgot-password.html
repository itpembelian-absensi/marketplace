<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/logo-sjs.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo-sjs.png" />
    <title>Lupa Password - PT SAHABAT JAYA SUKSES</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <img id="brandLogo" class="brand-logo hidden" alt="Logo" />
        <span class="brand-text">
          <h1>PT SAHABAT JAYA SUKSES</h1>
          <p>Reset password</p>
        </span>
      </a>
      <div class="top-actions">
        <img id="topLogo" class="top-logo hidden" alt="Logo" />
      </div>
    </header>

    <main class="container">
      <section class="auth-card">
        <h2>Lupa Password</h2>
        <p class="empty-state">Masukkan email akun. Kami kirim tautan untuk membuat password baru.</p>
        <form id="forgotForm" class="auth-form" autocomplete="off">
          <div>
            <label for="email" style="font-size:0.9rem; font-weight:500;">Email</label>
            <input type="email" id="email" placeholder="contoh@email.com" required autocomplete="email" style="margin-top:4px; width:100%; box-sizing:border-box;" />
          </div>
          <button type="submit" class="btn-primary" style="margin-top:8px;">Kirim tautan reset</button>
        </form>
        <p id="message" class="message"></p>
        <a class="auth-link" href="/login.html">Kembali ke login</a>
      </section>
    </main>

    <script src="/common.js?v=24"></script>
    <script src="/forgot-password.js"></script>
  </body>
</html>
