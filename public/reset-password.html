<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/logo-sjs.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo-sjs.png" />
    <title>Password Baru - PT SAHABAT JAYA SUKSES</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <img id="brandLogo" class="brand-logo hidden" alt="Logo" />
        <span class="brand-text">
          <h1>PT SAHABAT JAYA SUKSES</h1>
          <p>Password baru</p>
        </span>
      </a>
      <div class="top-actions">
        <img id="topLogo" class="top-logo hidden" alt="Logo" />
      </div>
    </header>

    <main class="container">
      <section class="auth-card">
        <h2>Buat Password Baru</h2>
        <p id="resetHint" class="empty-state">Memeriksa tautan reset...</p>
        <form id="resetForm" class="auth-form hidden" autocomplete="off">
          <div>
            <label for="password" style="font-size:0.9rem; font-weight:500;">Password baru</label>
            <input type="password" id="password" placeholder="Minimal 6 karakter" minlength="6" required autocomplete="new-password" style="margin-top:4px; width:100%; box-sizing:border-box;" />
          </div>
          <div>
            <label for="confirmPassword" style="font-size:0.9rem; font-weight:500;">Ulangi password</label>
            <input type="password" id="confirmPassword" placeholder="Ulangi password baru" minlength="6" required autocomplete="new-password" style="margin-top:4px; width:100%; box-sizing:border-box;" />
          </div>
          <button type="submit" class="btn-primary" style="margin-top:8px;">Simpan password</button>
        </form>
        <p id="message" class="message"></p>
        <a class="auth-link" href="/login.html">Kembali ke login</a>
      </section>
    </main>

    <script src="/common.js?v=24"></script>
    <script src="/reset-password.js"></script>
  </body>
</html>
