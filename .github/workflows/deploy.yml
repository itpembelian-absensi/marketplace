name: Deploy to Self-Hosted

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # Runner di server harus punya label: self-hosted + marketplace
    runs-on: [self-hosted, marketplace]

    defaults:
      run:
        shell: bash
        working-directory: /srv/docker/marketplace

    steps:
      - name: Free dangling Docker data
        run: |
          df -h || true
          docker system df || true
          docker builder prune -af || true
          docker image prune -f || true
          df -h || true

      - name: Check Docker daemon
        run: docker info

      - name: Sync code
        env:
          BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          rm -f .git/index.lock .git/HEAD.lock
          git fetch origin "$BRANCH"
          git reset --hard "$GIT_SHA"
          chmod +x ./deploy.sh ./scripts/*.sh

      - name: Run Deployment
        env:
          BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          FORCE_REBUILD: "0"
        run: |
          set -o pipefail
          bash ./scripts/deploy.sh 2>&1 | tee /tmp/marketplace-deploy.log

      - name: Surface deploy log on failure
        if: failure()
        run: |
          df -h || true
          docker images || true
          if [ -f /tmp/marketplace-deploy.log ]; then
            tail -n 30 /tmp/marketplace-deploy.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          docker compose --env-file .env.production ps || true
          docker compose --env-file .env.production logs --tail 40 app || true
