name: Deploy to Self-Hosted

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # Runner di server harus punya label: self-hosted + marketplace
    runs-on: [self-hosted, marketplace]

    defaults:
      run:
        working-directory: /srv/docker/marketplace

    steps:
      - name: Free Docker disk before deploy
        run: |
          df -h || true
          docker system df || true
          docker builder prune -af || true
          docker image prune -f || true
          df -h || true

      - name: Make scripts executable
        run: chmod +x ./deploy.sh ./scripts/*.sh

      - name: Run Deployment
        env:
          BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          FORCE_REBUILD: "0"
        run: ./deploy.sh
