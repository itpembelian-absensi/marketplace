name: Deploy to Self-Hosted

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # Runner di server harus punya label: self-hosted + marketplace
    runs-on: [self-hosted, marketplace]

    defaults:
      run:
        working-directory: /srv/docker/marketplace

    steps:
      - name: Free dangling Docker data
        run: |
          df -h || true
          docker system df || true
          docker builder prune -f || true
          docker image prune -f || true
          df -h || true

      - name: Sync code
        env:
          BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          rm -f .git/index.lock .git/HEAD.lock
          git fetch origin "$BRANCH"
          git reset --hard "$GIT_SHA"
          chmod +x ./deploy.sh ./scripts/*.sh

      - name: Run Deployment
        env:
          BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          FORCE_REBUILD: "0"
        run: ./deploy.sh
